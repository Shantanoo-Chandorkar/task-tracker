name: CI

on:
    pull_request:
    push:
        branches: [master, develop]

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.13.0'
                  cache: 'npm'

            - run: npm ci

            - run: npm run lint

            - run: npm run typecheck

            - run: npm run format:check

            # Vitest only: Playwright specs are deliberately never run in CI, they take too long
            - run: npm test

            # Scoped to production dependencies: dev-only tooling CVEs never ship to production,
            # so --omit=dev keeps the gate meaningful instead of chasing dev-tool advisories.
            - run: npm audit --omit=dev --audit-level=high
